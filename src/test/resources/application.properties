# Nos testes não há OpenTelemetry Collector: métricas ficam só no registro local (lidas pelo Actuator)
management.otlp.metrics.export.enabled=false
# Cache por bloco ligado só nos testes que sobem o Valkey (CacheIT, com CacheContainers): nos demais, toda
# leitura vai ao DynamoDB e as asserções sobre chamadas ao DynamoDB não dependem da ordem dos testes
consultas.cache.habilitado=false

# Prazos dos requisitos não funcionais (150/400 ms) são do ambiente real; com containers locais o primeiro acesso
# passa disso. Os testes de prazo e de resiliência usam contexto próprio com valores pequenos.
consultas.prazo.operacao=10s
consultas.prazo.cliente=10s
consultas.prazo.conta=10s
consultas.prazo.fonte-primaria.operacao=10s
consultas.prazo.fonte-primaria.cliente=10s
consultas.prazo.fonte-primaria.conta=10s
# Cota do mainframe alta nos contextos compartilhados: só o RateLimiterFontePrimariaIT testa o 429
consultas.fonte-primaria.cota.chamadas-por-segundo=100000
consultas.fonte-primaria.cota.max-tasks=1
# Nos contextos compartilhados, falhas provocadas de propósito por um teste não podem abrir o circuito para os outros
resilience4j.circuitbreaker.instances.fontePrimaria.sliding-window-size=1000
resilience4j.circuitbreaker.instances.fontePrimaria.minimum-number-of-calls=1000
# Cache por bloco ligado só nos testes que sobem o Valkey (CacheIT, com CacheContainers): nos demais, toda
# leitura vai ao DynamoDB e as asserções sobre chamadas ao DynamoDB não dependem da ordem dos testes
consultas.cache.habilitado=false
# Evento de consumo ligado só nos testes que leem a fila (EventoDeConsumoIT, com EventosDeConsumoContainers) ou
# derrubam o SQS (EventoDeConsumoSqsForaIT): nos demais não há envio ao SQS
consultas.eventos.habilitado=false
resilience4j.circuitbreaker.instances.dynamodb.sliding-window-size=1000
resilience4j.circuitbreaker.instances.dynamodb.minimum-number-of-calls=1000
# LocalStack em container responde mais devagar que o DynamoDB: o timeout de tentativa de produção (100 ms) faria
# retries por lentidão do ambiente; o teste de resiliência ajusta os timeouts no próprio contexto
consultas.dynamodb.timeout-tentativa=5s
consultas.dynamodb.timeout-chamada=15s
consultas.dynamodb.pool.timeout-resposta=5s
consultas.dynamodb.pool.timeout-obter-conexao=1s
