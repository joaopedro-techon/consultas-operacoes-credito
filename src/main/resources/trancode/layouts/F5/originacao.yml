# Layout do trancode do bloco originacao na custódia F5 (sobrepõe o layout base ../originacao.yml).
# A F5 não tem dependência contábil: o registro termina no canal de contratação e o campo
# dependencia_contabil fica ausente na saída.
bloco: originacao
estrutura: objeto
registro:
  campos:
    - { campo: id_operacao, inicio: 1, tamanho: 18, tipo: numero }
    - { campo: canal_contratacao, inicio: 19, tamanho: 20, tipo: texto }
