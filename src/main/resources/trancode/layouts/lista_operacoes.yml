# Layout do trancode da lista de operações de um cliente ou conta (formato descrito em README.md,
# "Fonte primária"): GET /mainframe/custodias/{custodia}/clientes/{cpf_cnpj}/operacoes e
# GET /mainframe/custodias/{custodia}/contas/{conta}/operacoes.
# Lista paginada: cabeçalho de página (quantidade, indicador de continuação e chave de continuação) + um
# registro por operação daquela custódia, sem ordem garantida.
bloco: lista_operacoes
estrutura: lista
registro:
  campos:
    - { campo: id_operacao, inicio: 1, tamanho: 18, tipo: numero }
    - { campo: data_contratacao_operacao, inicio: 19, tamanho: 10, tipo: data, formato: yyyy-MM-dd }
