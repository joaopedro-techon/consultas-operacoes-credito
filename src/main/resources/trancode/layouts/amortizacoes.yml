# Layout do trancode do bloco amortizacoes (formato descrito em README.md, "Fonte primária").
bloco: amortizacoes
estrutura: lista
registro:
  campos:
    - { campo: id_operacao, inicio: 1, tamanho: 18, tipo: numero }
    - { campo: numero_parcela_amortizacao, inicio: 19, tamanho: 3, tipo: numero }
    - { campo: numero_plano_amortizacao, inicio: 22, tamanho: 3, tipo: numero }
    - { campo: valor_principal_amortizado, inicio: 25, tamanho: 15, tipo: decimal, formato: 2 }
    - { campo: valor_juros_principal_amortizado, inicio: 40, tamanho: 15, tipo: decimal, formato: 2 }
    - { campo: indicador_ocorrencia_valida, inicio: 55, tamanho: 1, tipo: booleano, formato: SN }
    - { campo: data_valor_movimento, inicio: 56, tamanho: 19, tipo: data_hora, formato: "yyyy-MM-dd'T'HH:mm:ss" }
