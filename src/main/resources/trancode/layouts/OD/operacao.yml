# Layout do trancode do bloco operacao na custódia OD (sobrepõe o layout base ../operacao.yml).
# A OD traz o código do produto no meio do registro, deslocando os campos seguintes em 6 posições.
# Ele não faz parte do contrato da API: ignorar: true faz o parser pular o campo.
bloco: operacao
estrutura: objeto
registro:
  campos:
    - { campo: id_operacao, inicio: 1, tamanho: 18, tipo: numero }
    - { campo: situacao_operacao_credito, inicio: 19, tamanho: 15, tipo: texto }
    - { campo: codigo_produto_od, inicio: 34, tamanho: 6, tipo: texto, ignorar: true }
    - { campo: data_contratacao_operacao, inicio: 40, tamanho: 10, tipo: data, formato: yyyy-MM-dd }
    - { campo: data_baixa_operacao, inicio: 50, tamanho: 10, tipo: data, formato: yyyy-MM-dd }
    - { campo: cpf_cnpj, inicio: 60, tamanho: 14, tipo: texto }
