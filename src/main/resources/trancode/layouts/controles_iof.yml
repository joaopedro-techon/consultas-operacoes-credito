# Layout do trancode do bloco controles_iof (formato descrito em README.md, "Fonte primária").
bloco: controles_iof
estrutura: lista
registro:
  campos:
    - { campo: id_operacao, inicio: 1, tamanho: 18, tipo: numero }
    - { campo: numero_parcela_amortizacao, inicio: 19, tamanho: 3, tipo: numero }
    - { campo: numero_plano_amortizacao, inicio: 22, tamanho: 3, tipo: numero }
    - { campo: numero_sequencial_controle_iof, inicio: 25, tamanho: 3, tipo: numero }
    - { campo: valor_iof_devido, inicio: 28, tamanho: 15, tipo: decimal, formato: 2 }
    - { campo: valor_iof_pago, inicio: 43, tamanho: 15, tipo: decimal, formato: 2 }
    - { campo: data_pagamento_iof, inicio: 58, tamanho: 10, tipo: data, formato: yyyy-MM-dd }
