# Layout do trancode do bloco componentes (formato descrito em README.md, "Fonte primária").
bloco: componentes
estrutura: lista
registro:
  campos:
    - { campo: id_operacao, inicio: 1, tamanho: 18, tipo: numero }
    - { campo: numero_componente_financeiro, inicio: 19, tamanho: 3, tipo: numero }
    - { campo: codigo_tipo_componente_financeiro, inicio: 22, tamanho: 3, tipo: numero }
    - { campo: tipo_componente_financeiro, inicio: 25, tamanho: 20, tipo: texto }
    - { campo: valor_componente_financeiro, inicio: 45, tamanho: 15, tipo: decimal, formato: 2 }
    - { campo: situacao_componente_financeiro, inicio: 60, tamanho: 10, tipo: texto }
