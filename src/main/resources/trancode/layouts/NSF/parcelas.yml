# Layout do trancode do bloco parcelas na custódia NSF (sobrepõe o layout base ../parcelas.yml).
# Mesmos campos da base, em outra ordem: situação, juros e principal vêm antes do vencimento.
bloco: parcelas
estrutura: lista
registro:
  campos:
    - { campo: id_operacao, inicio: 1, tamanho: 18, tipo: numero }
    - { campo: numero_parcela_amortizacao, inicio: 19, tamanho: 3, tipo: numero }
    - { campo: numero_plano_amortizacao, inicio: 22, tamanho: 3, tipo: numero }
    - { campo: situacao_parcela, inicio: 25, tamanho: 15, tipo: texto }
    - { campo: valor_juros_principal_parcela, inicio: 40, tamanho: 15, tipo: decimal, formato: 2 }
    - { campo: valor_principal_parcela, inicio: 55, tamanho: 15, tipo: decimal, formato: 2 }
    - { campo: data_vencimento_parcela, inicio: 70, tamanho: 10, tipo: data, formato: yyyy-MM-dd }
