# Layout do trancode do bloco parcelas (formato descrito em README.md, "Fonte primária").
bloco: parcelas
estrutura: lista
registro:
  campos:
    - { campo: id_operacao, inicio: 1, tamanho: 18, tipo: numero }
    - { campo: numero_parcela_amortizacao, inicio: 19, tamanho: 3, tipo: numero }
    - { campo: numero_plano_amortizacao, inicio: 22, tamanho: 3, tipo: numero }
    - { campo: data_vencimento_parcela, inicio: 25, tamanho: 10, tipo: data, formato: yyyy-MM-dd }
    - { campo: valor_principal_parcela, inicio: 35, tamanho: 15, tipo: decimal, formato: 2 }
    - { campo: valor_juros_principal_parcela, inicio: 50, tamanho: 15, tipo: decimal, formato: 2 }
    - { campo: situacao_parcela, inicio: 65, tamanho: 15, tipo: texto }
