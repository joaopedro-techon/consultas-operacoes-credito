# Layout do trancode do bloco plano (formato descrito em README.md, "Fonte primária").
bloco: plano
estrutura: objeto
registro:
  campos:
    - { campo: id_operacao, inicio: 1, tamanho: 18, tipo: numero }
    - { campo: numero_plano_amortizacao_ativo, inicio: 19, tamanho: 3, tipo: numero }
  listas:
    - campo: dados_plano_amortizacao
      registro:
        campos:
          - { campo: taxa_juros_nominal, inicio: 1, tamanho: 7, tipo: decimal, formato: 2 }
          - { campo: taxa_juros_efetiva, inicio: 8, tamanho: 7, tipo: decimal, formato: 2 }
          - { campo: situacao_plano_amortizacao, inicio: 15, tamanho: 15, tipo: texto }
          - { campo: numero_plano_amortizacao_ativo, inicio: 30, tamanho: 3, tipo: numero }
        listas:
          - campo: encargos_moratorios
            registro:
              campos:
                - { campo: dia_inicio, inicio: 1, tamanho: 4, tipo: numero }
                - { campo: dia_fim, inicio: 5, tamanho: 4, tipo: numero }
                - { campo: taxa_mora, inicio: 9, tamanho: 7, tipo: decimal, formato: 2 }
                - { campo: taxa_multa, inicio: 16, tamanho: 7, tipo: decimal, formato: 2 }
          - campo: desconto_bom_pagador
            registro:
              campos:
                - { campo: quantidade_dias_atraso, inicio: 1, tamanho: 5, tipo: numero }
                - { campo: percentual_desconto, inicio: 6, tamanho: 7, tipo: decimal, formato: 2 }
