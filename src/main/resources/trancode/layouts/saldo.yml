# Layout do trancode do bloco saldo (formato descrito em README.md, "Fonte primária").
bloco: saldo
estrutura: objeto
registro:
  campos:
    - { campo: id_operacao, inicio: 1, tamanho: 18, tipo: numero }
    - { campo: saldo_devedor_operacao, inicio: 19, tamanho: 15, tipo: decimal, formato: 2 }
    - { campo: quantidade_dias_atraso, inicio: 34, tamanho: 5, tipo: numero }
    - { campo: data_posicao_calculo, inicio: 39, tamanho: 10, tipo: data, formato: yyyy-MM-dd }
  listas:
    - campo: saldo_parcelas
      registro:
        campos:
          - { campo: id_operacao, inicio: 1, tamanho: 18, tipo: numero }
          - { campo: numero_parcela_amortizacao, inicio: 19, tamanho: 3, tipo: numero }
          - { campo: numero_plano_amortizacao, inicio: 22, tamanho: 3, tipo: numero }
          - { campo: saldo_devedor, inicio: 25, tamanho: 15, tipo: decimal, formato: 2 }
