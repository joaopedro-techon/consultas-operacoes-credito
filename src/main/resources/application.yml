spring:
  application:
    name: consultas-operacoes-credito
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

consultas:
  dynamodb:
    tabela: ${CONSULTAS_DYNAMODB_TABELA:operacoes-credito}
    regiao: ${AWS_REGION:sa-east-1}
    endpoint: ${CONSULTAS_DYNAMODB_ENDPOINT:}
