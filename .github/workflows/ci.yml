name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Testes HTTP de caixa-preta sobem o LocalStack com Testcontainers (Docker do runner)
      - name: Build e testes
        run: ./mvnw -B verify
      - name: Imagem Docker
        run: docker build -t consultas-operacoes-credito:${{ github.sha }} .
