name: consultas-operacoes-credito

services:
  localstack:
    # Última tag Community que sobe sem auth token (ADR-0003). Uso exclusivo em desenvolvimento local.
    image: localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb
      AWS_DEFAULT_REGION: sa-east-1
      CONSULTAS_DYNAMODB_TABELA: operacoes-credito
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - ./localstack/massa:/etc/localstack/massa:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      AWS_REGION: sa-east-1
      CONSULTAS_DYNAMODB_TABELA: operacoes-credito
      CONSULTAS_DYNAMODB_ENDPOINT: http://localstack:4566
      CONSULTAS_DYNAMODB_CREDENCIAIS_ACCESS_KEY_ID: test
      CONSULTAS_DYNAMODB_CREDENCIAIS_SECRET_ACCESS_KEY: test
    depends_on:
      localstack:
        condition: service_healthy
