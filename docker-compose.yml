name: consultas-operacoes-credito

services:
  localstack:
    # Última tag Community que sobe sem auth token (ADR-0003). Uso exclusivo em desenvolvimento local.
    image: localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb
      AWS_DEFAULT_REGION: sa-east-1
      CONSULTAS_DYNAMODB_TABELA: operacoes-credito
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - ./localstack/massa:/etc/localstack/massa:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 3s
      retries: 30

  wiremock:
    # Gateway do mainframe (fonte primária): stubs de trancode gerados por localstack/gerar_trancode.py
    image: wiremock/wiremock:3.13.2
    command: ["--disable-banner"]
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    # Cache por bloco da visão consolidada (ADR-0002); sem persistência: é só cache
    image: valkey/valkey:9.0.8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      AWS_REGION: sa-east-1
      CONSULTAS_DYNAMODB_TABELA: operacoes-credito
      CONSULTAS_DYNAMODB_ENDPOINT: http://localstack:4566
      CONSULTAS_DYNAMODB_CREDENCIAIS_ACCESS_KEY_ID: test
      CONSULTAS_DYNAMODB_CREDENCIAIS_SECRET_ACCESS_KEY: test
      CONSULTAS_FONTE_PRIMARIA_URL: http://wiremock:8080
      CONSULTAS_VALKEY_HOST: valkey
      CONSULTAS_VALKEY_PORTA: "6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health/readiness HTTP/1.0\r\n\r\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      localstack:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      valkey:
        condition: service_healthy
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observabilidade/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    # Jaeger v2 (all-in-one, armazenamento em memória), recebe OTLP do Collector
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/consultas-operacoes-credito.json
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_started
